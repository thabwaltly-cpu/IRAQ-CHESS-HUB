name: Extract Chess Source

on:
  push:
    paths:
      - ".github/workflows/inspect-source.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p extracted-source
          unzip -q IRAQ_CHESS_HUB_Android_Dev_v1.11.0.zip -d extracted-source
          find extracted-source -type f | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: iraq-chess-hub-source
          path: extracted-source/
          retention-days: 7
