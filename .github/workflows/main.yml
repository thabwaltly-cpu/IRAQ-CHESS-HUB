
name: Build IRAQ CHESS HUB Android APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'IRAQ_CHESS_HUB_Android_Dev_v1.11.0.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/IRAQ_CHESS_HUB_Android_Dev_v1.11.0.zip"

          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE"

          mkdir -p "$RUNNER_TEMP/iraq-src"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/iraq-src"

          PROJECT_DIR="$RUNNER_TEMP/iraq-src/IRAQ_CHESS_HUB_Android"

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/tools/vision_reference_check.py"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Source extraction and validation successful."

      - name: Validate extracted project files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          KOTLIN_COUNT=$(find "$PROJECT_DIR/app/src/main" -name "*.kt" | wc -l)

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "ERROR: No Kotlin source files found."
            exit 1
          fi

          echo "Kotlin files found: $KOTLIN_COUNT"

      - name: Fix MainActivity Kotlin reference
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app" / "src" / "main"
          files = list(source.rglob("MainActivity.kt"))

          if len(files) != 1:
              raise SystemExit(
                  f"Expected exactly one MainActivity.kt, found {len(files)}"
              )

          file = files[0]
          content = file.read_text(encoding="utf-8")

          old = "game.sanMoves.getOrNull(replayPly - 1)"
          new = "importedPgn?.sanMoves?.getOrNull(replayPly - 1)"

          count = content.count(old)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one faulty reference, found {count}. "
                  "No changes made."
              )

          content = content.replace(old, new, 1)
          file.write_text(content, encoding="utf-8")

          if old in file.read_text(encoding="utf-8"):
              raise SystemExit("Fix verification failed.")

          print(f"SUCCESS: Fixed {file}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Run vision reference check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python tools/vision_reference_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Checkout Stockfish 19
        uses: actions/checkout@v4
        with:
          repository: official-stockfish/Stockfish
          ref: sf_19
          path: .stockfish
          fetch-depth: 1

      - name: Build Stockfish for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make -C .stockfish/src -j2 net

          make -C .stockfish/src -j2 build \
            ARCH=armv8 \
            COMP=ndk \
            COMPCXX=aarch64-linux-android26-clang++

          make -C .stockfish/src strip \
            ARCH=armv8 \
            COMP=ndk \
            COMPCXX=aarch64-linux-android26-clang++

          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/licenses"

          install -m 0755 \
            .stockfish/src/stockfish \
            "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

          readelf -h "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libstockfish.so" \
            | grep -q 'AArch64'

          test -f .stockfish/Copying.txt

          cp .stockfish/Copying.txt \
            "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt"

          echo "Stockfish 19, official tag sf_19" \
            > "$PROJECT_DIR/app/src/main/assets/licenses/STOCKFISH_BUILD_INFO.txt"

          echo "Target: Android arm64-v8a" \
            >> "$PROJECT_DIR/app/src/main/assets/licenses/STOCKFISH_BUILD_INFO.txt"

      - name: Build host Stockfish for tests
        shell: bash
        run: |
          set -euo pipefail

          cp -a .stockfish "$RUNNER_TEMP/stockfish-host"

          make -C "$RUNNER_TEMP/stockfish-host/src" clean

          make -C "$RUNNER_TEMP/stockfish-host/src" -j2 build \
            ARCH=x86-64 \
            COMP=gcc

      - name: Run core checks
        shell: bash
        env:
          REAL_STOCKFISH_BINARY: ${{ runner.temp }}/stockfish-host/src/stockfish
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash tools/run-core-checks.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Verify APK integrity and compatibility
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          echo "Checking APK existence..."
          test -s "$APK"

          echo "Checking APK archive integrity..."
          unzip -t "$APK"

          echo "Checking APK alignment..."
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          echo "Checking APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          echo "Checking Android package information..."
          "$BUILD_TOOLS/aapt" dump badging "$APK"

          echo "Checking Android manifest..."
          unzip -l "$APK" | grep -F 'AndroidManifest.xml'

          echo "Checking Stockfish ARM64 library..."
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstockfish.so'

          echo "Checking Stockfish license..."
          test -s "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt"

          echo "Checking APK size..."
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK size in bytes: $APK_SIZE"

          if [ "$APK_SIZE" -lt 1048576 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "Generating APK checksum..."
          sha256sum "$APK"

          echo "SUCCESS: APK integrity checks passed."

      - name: Prepare Stockfish source bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          tar -C .stockfish \
            -czf "$RUNNER_TEMP/release/stockfish-19-source.tar.gz" \
            --exclude='.git' \
            --exclude='src/stockfish' \
            --exclude='src/*.o' .

          cp \
            "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt" \
            "$RUNNER_TEMP/release/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAQ-CHESS-HUB-debug-v1.11.0
          path: ${{ runner.temp }}/iraq-src/IRAQ_CHESS_HUB_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Stockfish source
        uses: actions/upload-artifact@v4
        with:
          name: IRAQ-CHESS-HUB-Stockfish-19-source
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          
