name: Build IRAQ CHESS HUB Android APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'IRAQ_CHESS_HUB_Android_Dev_v1.11.0.zip'
      - '.github/workflows/build-android-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository containing the source ZIP
        uses: actions/checkout@v4

      - name: Validate and extract v1.11.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/IRAQ_CHESS_HUB_Android_Dev_v1.11.0.zip"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/iraq-src"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/iraq-src"
          PROJECT_DIR="$RUNNER_TEMP/iraq-src/IRAQ_CHESS_HUB_Android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/.github/workflows/android-apk.yml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Python for reference-board vision regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify reference image and bundled 26-PNG templates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python -m pip install --disable-pip-version-check pillow numpy
          python tools/vision_reference_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
        with:
          packages: 'platform-tools'
      - name: Install Android SDK, NDK r27c and Kotlin compiler 2.0.21
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip \
            -o "$RUNNER_TEMP/kotlin-compiler.zip"
          mkdir -p "$RUNNER_TEMP/kotlinc"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlinc"
          echo "$RUNNER_TEMP/kotlinc/kotlinc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kotlinc/kotlinc/bin/kotlinc" -version

      - name: Check out official Stockfish 19 source
        uses: actions/checkout@v4
        with:
          repository: official-stockfish/Stockfish
          ref: sf_19
          path: .stockfish
          fetch-depth: 1

      - name: Build real Stockfish 19 for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C .stockfish/src -j2 net
          make -C .stockfish/src -j2 build ARCH=armv8 COMP=ndk COMPCXX=aarch64-linux-android26-clang++
          make -C .stockfish/src strip ARCH=armv8 COMP=ndk COMPCXX=aarch64-linux-android26-clang++
          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a" "$PROJECT_DIR/app/src/main/assets/licenses"
          install -m 0755 .stockfish/src/stockfish "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          readelf -h "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libstockfish.so" | grep -q 'AArch64'
          cp .stockfish/COPYING "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt"
          STOCKFISH_COMMIT="$(git -C .stockfish rev-parse HEAD)"
          STOCKFISH_SHA256="$(sha256sum "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libstockfish.so" | cut -d' ' -f1)"
          {
            echo "Engine: Stockfish 19 (official-stockfish/Stockfish, tag sf_19)"
            echo "Source commit: ${STOCKFISH_COMMIT}"
            echo "Target: Android arm64-v8a / ARMv8"
            echo "NDK: r27c (27.2.12479018), Android API 26"
            echo "Binary SHA-256: ${STOCKFISH_SHA256}"
            echo "License: GPL-3.0; see Stockfish-GPL-3.0.txt and the corresponding-source artifact."
            echo "Source: https://github.com/official-stockfish/Stockfish/tree/sf_19"
          } > "$PROJECT_DIR/app/src/main/assets/licenses/STOCKFISH_BUILD_INFO.txt"

      - name: Build host Stockfish for real UCI integration tests
        shell: bash
        run: |
          set -euo pipefail
          cp -a .stockfish "$RUNNER_TEMP/stockfish-host"
          make -C "$RUNNER_TEMP/stockfish-host/src" clean
          make -C "$RUNNER_TEMP/stockfish-host/src" -j2 build ARCH=x86-64 COMP=gcc

      - name: Run 219 core checks and real Stockfish UCI smoke tests
        shell: bash
        env:
          REAL_STOCKFISH_BINARY: ${{ runner.temp }}/stockfish-host/src/stockfish
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash tools/run-core-checks.sh

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK contains the ARM64 Stockfish engine
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstockfish.so'
          test -s "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt"
          test -s "$PROJECT_DIR/app/src/main/assets/licenses/STOCKFISH_BUILD_INFO.txt"

      - name: Prepare corresponding Stockfish source and license bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          tar -C .stockfish -czf "$RUNNER_TEMP/release/stockfish-19-corresponding-source.tar.gz" \
            --exclude='.git' --exclude='src/stockfish' --exclude='src/*.o' \
            --exclude='src/*.profraw' --exclude='src/temp_builds' .
          cp "$PROJECT_DIR/app/src/main/assets/licenses/Stockfish-GPL-3.0.txt" "$RUNNER_TEMP/release/"
          cp "$PROJECT_DIR/app/src/main/assets/licenses/STOCKFISH_BUILD_INFO.txt" "$RUNNER_TEMP/release/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAQ-CHESS-HUB-debug-v1.11.0
          path: ${{ runner.temp }}/iraq-src/IRAQ_CHESS_HUB_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Stockfish corresponding source and GPL license
        uses: actions/upload-artifact@v4
        with:
          name: IRAQ-CHESS-HUB-Stockfish-19-GPL-source
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
